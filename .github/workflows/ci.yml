name: CI

on:
  push:
    branches: [main, 'harness/**']
  pull_request:

permissions:
  contents: read

concurrency:
  # Branches: one group per ref, superseded runs cancelled. main: one group per
  # commit, so back-to-back merges each finish their own run (a shared group
  # would cancel the *pending* run when a third push arrives).
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Assert no service variables are set
        run: |
          for v in DATABASE_URL REDIS_URL TEST_DATABASE_URL TEST_REDIS_URL; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set; the unit job must run with no service variables"
              exit 1
            fi
          done
      - name: Build
        run: go build ./...
      - name: gofmt
        run: |
          set -o pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l reports unformatted Go files — run: gofmt -w <file>"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"
      - name: Vet
        run: go vet ./...
      - name: Test without services
        run: go test ./... -count=1 -race

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: english
          POSTGRES_PASSWORD: english
          POSTGRES_DB: english
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://english:english@localhost:5432/english?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Integration tests must run, not skip
        run: |
          set -o pipefail
          # -p 1: every package's integration tests share one physical
          # database (this job's single Postgres service container), and
          # some packages (internal/store) destructively drop and recreate
          # the schema around each of their own tests. Running packages'
          # test binaries in parallel (go test's default) races: one
          # package's schema reset/migrate can run concurrently with
          # another's, so results become order- and timing-dependent. -p 1
          # runs one package's test binary at a time; within a package,
          # tests still run in their own declared order/parallelism.
          go test ./... -count=1 -v -run Integration -p 1 2>&1 | tee integration.log
          want=$(grep -rho '^func TestIntegration[A-Za-z0-9_]*' --include='*_test.go' . | wc -l | tr -d ' ')
          got=$(grep -c '^--- PASS: TestIntegration' integration.log || true)
          if grep -q '^--- SKIP' integration.log; then
            echo "::error::an integration test skipped; TEST_DATABASE_URL / TEST_REDIS_URL did not reach the tests"
            exit 1
          fi
          if [ "$want" -eq 0 ] || [ "$got" -ne "$want" ]; then
            echo "::error::expected $want passing TestIntegration* tests, saw $got"
            exit 1
          fi
          echo "$got/$want integration tests ran and passed"

  harness-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Harness unit tests
        run: python3 -m unittest discover -s tools/harness/tests
      - name: Validate harness artifacts
        run: python3 tools/harness/cli.py validate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --pull -t aelp-api:ci -f backend/Dockerfile backend
      - name: API image runs (config.Load refuses to boot without env)
        run: |
          set +e
          out=$(docker run --rm aelp-api:ci 2>&1); code=$?
          set -e
          echo "$out" | tail -3
          if [ "$code" -eq 0 ] || ! echo "$out" | grep -q 'config: DATABASE_URL is required'; then
            echo "::error::expected the API to exit non-zero with 'config: DATABASE_URL is required' (exit $code)"
            exit 1
          fi
      - name: Build web image
        run: |
          docker build --pull -t aelp-web:ci -f frontend/Dockerfile \
            --build-arg NUXT_PUBLIC_API_BASE=https://api.example.test frontend
      - name: Web image serves the PWA with the right cache headers
        run: |
          docker run -d --rm --name web -p 18081:80 aelp-web:ci
          for _ in $(seq 1 20); do curl -sf --max-time 2 http://127.0.0.1:18081/healthz >/dev/null && break; sleep 1; done
          docker run --rm --entrypoint sh aelp-web:ci -c 'grep -rql "api.example.test" /srv' \
            || { echo "::error::NUXT_PUBLIC_API_BASE build arg did not reach the generated site"; exit 1; }
          deploy/smoke-web.sh http://127.0.0.1:18081
          docker stop web
      - name: Production compose file is valid
        run: |
          cat > "$RUNNER_TEMP/deploy.env" <<EOF2
          POSTGRES_PASSWORD=ci-only
          JWT_SECRET=$(openssl rand -base64 32)
          ENCRYPTION_SECRET_KEY=$(openssl rand -hex 32)
          GOOGLE_CLIENT_ID=ci-only
          GOOGLE_CLIENT_SECRET=ci-only
          FRONTEND_ORIGIN=https://app.example.test
          NUXT_PUBLIC_API_BASE=https://api.example.test
          EOF2
          docker compose --env-file "$RUNNER_TEMP/deploy.env" -f deploy/compose.yml config -q
          # And the guards hold: without the env file, config must fail.
          if docker compose -f deploy/compose.yml config -q 2>/dev/null; then
            echo "::error::compose config succeeded with no env — the :? guards are missing"
            exit 1
          fi
