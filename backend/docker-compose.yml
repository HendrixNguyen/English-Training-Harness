# Dev only. Not used in deployment: spec §8 provisions Postgres and Redis as
# Railway plugins and injects DATABASE_URL / REDIS_URL.
# Host ports are overridable: copy .env.example to .env and set POSTGRES_PORT /
# REDIS_PORT if something else on this machine already holds 5432 or 6379.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: english
      POSTGRES_PASSWORD: english
      POSTGRES_DB: english
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

# Named so `make down` keeps the dev database. `docker compose down -v` discards it.
volumes:
  postgres_data:
